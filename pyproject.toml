[project]
name = "reactfrontendchatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruchi Kajal", email = "rkajalglobal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.6",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
reactfrontendchatbot = "reactfrontendchatbot:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
